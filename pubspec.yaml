name: unlock_numbers
description: "Unlock Numbers - a calm, clever number-unlocking puzzle game."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.0
  audioplayers: ^6.1.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/config/
    - assets/i18n/
    - assets/themes/
    - assets/design/
    - assets/levels/
    - assets/audio/
    - assets/fonts/OFL-Cairo.txt
    - assets/fonts/OFL-NunitoSans.txt
    - assets/fonts/OFL-CinzelDecorative.txt

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-500.ttf
          weight: 500
        - asset: assets/fonts/Cairo-600.ttf
          weight: 600
        - asset: assets/fonts/Cairo-700.ttf
          weight: 700
    - family: NunitoSans
      fonts:
        - asset: assets/fonts/NunitoSans-600.ttf
          weight: 600
        - asset: assets/fonts/NunitoSans-700.ttf
          weight: 700
    - family: CinzelDecorative
      fonts:
        - asset: assets/fonts/CinzelDecorative-Bold.ttf
          weight: 700
        - asset: assets/fonts/CinzelDecorative-Black.ttf
          weight: 900

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/app_icon_1024.png"
  adaptive_icon_background: "#3B2F7A"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  remove_alpha_ios: true
  min_sdk_android: 21
